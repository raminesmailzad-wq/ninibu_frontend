services:
  frontend:
    image: ${NINIBU_FRONTEND_IMAGE:-ninibu-frontend:0.24.3}
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_NINIBU_ANALYTICS_ENDPOINT: ""
        NEXT_PUBLIC_NINIBU_PAYMENT_PROVIDER: "${NEXT_PUBLIC_NINIBU_PAYMENT_PROVIDER:-disabled}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NINIBU_BACKEND_URL: http://api:8081
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ninibu_backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  pwa:
    image: ${NINIBU_PWA_IMAGE:-ninibu-pwa:0.24.3}
    build:
      context: .
      dockerfile: Dockerfile.pwa
      network: host
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    networks:
      - ninibu_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  ninibu_backend:
    external: true
    name: ninibu-backend_ninibu_backend
